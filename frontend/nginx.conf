server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite) pueden cachearse agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
